name: Build Android APK

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Ensure Android SDK components (runner 预装 SDK，容错补装 Capacitor 6 所需)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
            echo "SDK components ready"
          else
            echo "使用运行器预装 SDK（未找到 sdkmanager，跳过补装）"
          fi

      - name: Prepare web assets (www)
        run: |
          rm -rf www
          mkdir -p www
          cp -v index.html www/
          cp -rv lib www/lib
          cp -rv plugins www/plugins
          [ -d assets ] && [ "$(ls -A assets 2>/dev/null)" ] && cp -rv assets www/assets || mkdir -p www/assets
          echo "=== www 文件统计 ==="
          find www -type f | wc -l
          echo "=== www/plugins 完整文件列表 ==="
          find www/plugins -type f | sort
          echo "=== 校验 15-functions.js 和 89-macro.js 是否存在 ==="
          test -f www/plugins/15-functions.js && echo "OK: 15-functions.js" || (echo "FATAL: 15-functions.js missing"; exit 1)
          test -f www/plugins/89-macro.js && echo "OK: 89-macro.js" || (echo "FATAL: 89-macro.js missing"; exit 1)

      - name: Setup Capacitor project
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.myexcel.app",
            "appName": "MyExcel",
            "webDir": "www",
            "android": {
              "allowMixedContent": false
            },
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Build APK (debug, ready to install)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g"

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/MyExcel-1.0.0.apk
          ls -la out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyExcel-Android-APK
          path: out/MyExcel-1.0.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.1.0 >/dev/null 2>&1 || \
            gh release create v1.1.0 \
              --title "极致表格 Ultimate-Excel v1.1.0" \
              --notes "Android 版（MyExcel-1.0.0.apk）。

          ## 本版亮点
          - 函数引擎扩展至 500 个（金融债券族/统计矩阵/动态数组/文本函数）
          - 全新 JavaScript 宏系统（菜单打开宏面板）

          ## 安装说明
          - 下载 APK 后直接安装（需允许安装未知来源应用）"
          gh release upload v1.1.0 out/MyExcel-1.0.0.apk --clobber
