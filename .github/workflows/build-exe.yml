name: Build Windows EXE

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build EXE (portable + NSIS installer)
        run: npx electron-builder --win portable nsis --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CI 环境无需代码签名校验
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: List artifacts
        run: Get-ChildItem dist -Recurse -File | Select-Object Name, Length | Format-Table | Out-String
        if: always()

      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyExcel-Windows-EXE
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 30
