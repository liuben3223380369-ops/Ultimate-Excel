name: Build Windows EXE

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build EXE (portable + NSIS installer)
        run: npx electron-builder --win portable nsis --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CI 环境无需代码签名校验
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: List artifacts
        run: Get-ChildItem dist -Recurse -File | Select-Object Name, Length | Format-Table | Out-String
        if: always()

      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyExcel-Windows-EXE
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = Get-ChildItem dist -Filter *.exe | ForEach-Object { $_.FullName }
          gh release view v1.1.0 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create v1.1.0 @files `
              --title "极致表格 Ultimate-Excel v1.1.0" `
              --notes "Windows 桌面版（绿色版 + 安装版）。

          ## 本版亮点
          - 函数引擎扩展至 500 个（金融债券族/统计矩阵/动态数组/文本函数）
          - 全新 JavaScript 宏系统（Ctrl+Alt+M 打开宏面板）

          ## 安装说明
          - 便携版（-Portable.exe）：下载后双击即可运行，无需安装
          - 安装版（-Setup.exe）：双击安装到系统"
          } else {
            gh release upload v1.1.0 @files --clobber
          }
